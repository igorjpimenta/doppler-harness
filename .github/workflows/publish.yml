# Publishes a release to npm from the tag it names, and refuses to publish a
# version the registry has already seen.
#
# Auth is Trusted Publishing: npm exchanges this job's OIDC identity for a
# short-lived publish token, scoped to this repo and this workflow. There is no
# token to store, leak, or rotate, and npm's 2FA on the owner account stays in
# force — which matters, because a granular token that bypasses 2FA can publish
# but is refused for unpublish outright.
#
# Requires, once, on npmjs.com under the package: Access → Trusted Publisher →
# repository igorjpimenta/doppler-harness, workflow publish.yml. Optional: an
# environment name, which then also has to be selected here.
name: publish

on:
  # A published GitHub Release is the human signal that a version is ready.
  release:
    types: [published]
  # Backfilling a historical tag: workflow_dispatch with the tag as input.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. 2026.10.16 or 2026.10.17-beta.1"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # The adapter publishes under its own tag prefix; this job is the core.
    if: ${{ !startsWith(inputs.tag || github.event.release.tag_name, 'doppler-opencode-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing is OIDC: npm >= 11.5.1 exchanges the job's id-token
      # for a registry token. setup-node's registry-url also writes an
      # _authToken=${NODE_AUTH_TOKEN} line into the npmrc it points at; with no
      # NODE_AUTH_TOKEN in the environment that expands to empty, npm reads it
      # as "auth is configured", skips the OIDC exchange, and publish dies with
      # a 404 from the registry. Node 22 ships npm 10 — upgrade, then strip the
      # line so the exchange can run.
      - name: Give npm the OIDC-capable CLI and a clean auth config
        run: |
          set -euo pipefail
          npm install -g npm@latest
          npm --version
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          sed -i '/_authToken/d' "$npmrc"
          cat "$npmrc"

      - name: Name this job what it is publishing
        id: meta
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.event.release.tag_name }}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag $TAG does not match package.json $VERSION — the tag is the contract; bump them together"
            exit 1
          fi
          # The dist-tag follows the version's role, never the calendar: a
          # suffixed version is a pre-release and must not take `latest`.
          case "$VERSION" in
            *-*) DIST_TAG="beta" ;;
            *)   DIST_TAG="latest" ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist-tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      # A version the registry has ever held — published, or published and
      # unpublished — is permanently unusable, and npm's rejection arrives only
      # AFTER the upload. `time` lists those tombstones; `versions` omits them,
      # so checking only the latter is how a rename-then-unpublish sequence
      # walks into a version that can never be published.
      - name: Refuse a version the registry has already seen
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').name")
          VERSION="${{ steps.meta.outputs.version }}"
          if npm view "$PKG" time --json | grep -q "\"$VERSION\""; then
            echo "::error::$PKG@$VERSION was published before — tombstoned or live. Pick a new version; a published version can never be reused."
            exit 1
          fi
          echo "$PKG@$VERSION is unused on the registry"

      - run: npm ci

      # ENEEDAUTH has two distinct causes — the job never received the OIDC
      # request vars, or npm's exchange failed (trusted publisher absent or
      # misnamed on npmjs.com). The publish error alone does not say which.
      - name: Diagnose OIDC availability
        run: |
          set -euo pipefail
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "id-token: job HAS the OIDC request vars -> failure is npm-side (trusted publisher config)"
          else
            echo "::error::id-token: job has NO OIDC request vars -> GitHub did not grant id-token:write"
            exit 1
          fi

      - run: npm publish --provenance --tag "${{ steps.meta.outputs.dist-tag }}"

      - name: Record what is now the default install
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').name")
          VERSION="${{ steps.meta.outputs.version }}"
          DIST_TAG="${{ steps.meta.outputs.dist-tag }}"
          echo "published $PKG@$VERSION under $DIST_TAG"
          npm view "$PKG" dist-tags --json
          npm view "$PKG" versions --json

  # The host half of the engine, its own package and its own tag line:
  # doppler-opencode-<semver>. Release order matters — its dependency on the
  # core is a real npm range, so the core publishes first and this job's
  # `npm install` resolves it.
  publish-opencode:
    if: startsWith(inputs.tag || github.event.release.tag_name, 'doppler-opencode-')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/opencode/doppler
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Same OIDC prerequisites as the core job: npm >= 11.5.1 for the
      # id-token exchange, and no _authToken line left to pre-empt it.
      - name: Give npm the OIDC-capable CLI and a clean auth config
        run: |
          set -euo pipefail
          npm install -g npm@latest
          npm --version
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          sed -i '/_authToken/d' "$npmrc"
          cat "$npmrc"

      - name: Name this job what it is publishing
        id: meta
        run: |
          set -euo pipefail
          # GITHUB_REF_NAME is the ref the dispatch ran from (main), not the
          # input — the same expression the core job and the checkout use.
          REF="${{ inputs.tag || github.event.release.tag_name }}"
          TAG="${REF#doppler-opencode-}"
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::${REF} is not doppler-opencode-<semver>"
            exit 1
          fi
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag $TAG does not match package.json $VERSION — the tag is the contract; bump them together"
            exit 1
          fi
          case "$VERSION" in
            *-*) DIST_TAG="beta" ;;
            *)   DIST_TAG="latest" ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist-tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      - name: Refuse a version the registry has already seen
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').name")
          VERSION="${{ steps.meta.outputs.version }}"
          if npm view "$PKG" time --json | grep -q "\"$VERSION\""; then
            echo "::error::$PKG@$VERSION was published before — tombstoned or live. Pick a new version; a published version can never be reused."
            exit 1
          fi
          echo "$PKG@$VERSION is unused on the registry"

      # One node_modules tree only: the build spans adapter files and core
      # src, so installing both roots yields two @opencode-ai/sdk copies whose
      # OpencodeClient types do not unify (TS2345 on every call site). The
      # root npm ci already covers the adapter's declared devDependencies —
      # the same three packages — and npm run resolves tsc from ancestor
      # node_modules/.bin (the adapter has no node_modules of its own in any
      # working checkout).
      - run: npm ci
        working-directory: .
      - run: npm run build
      - run: npm publish --provenance --tag "${{ steps.meta.outputs.dist-tag }}"
