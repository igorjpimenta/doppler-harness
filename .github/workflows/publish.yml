# Publishes a release to npm from the tag it names. A version the registry has
# ever held is never reused: a live version is skipped so re-runs are green,
# an unpublished tombstone fails hard — npm's rejection for those arrives only
# AFTER the upload, which is why `time` (not `versions`) is the source of
# truth.
#
# Auth is Trusted Publishing (OIDC): npm exchanges this job's id-token for a
# short-lived publish token. Trusted-publisher entries exist on both packages
# (repository igorjpimenta/doppler-harness, file publish.yml, manageDistTags
# included) and both have published through this path — npm logs every exchange
# failure at verbose only (npm/cli #9923), so publish runs --loglevel silly.
# NODE_AUTH_TOKEN is pinned empty on the publish and dist-tag steps:
# setup-node's registry-url leaves an XXXXX placeholder in the job env, and a
# non-empty token changes the failure from ENEEDAUTH into a PUT 404 that hides
# the exchange entirely.
name: publish

on:
  # A published GitHub Release is the human signal that a version is ready.
  release:
    types: [published]
  # Backfilling a historical tag: workflow_dispatch with the tag as input.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. 2026.10.16 or 2026.10.17-beta.1"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # The adapter publishes under its own tag prefix; this job is the core.
    if: ${{ !startsWith(inputs.tag || github.event.release.tag_name, 'doppler-opencode-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Name this job what it is publishing
        id: meta
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.event.release.tag_name }}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag $TAG does not match package.json $VERSION — the tag is the contract; bump them together"
            exit 1
          fi
          # The dist-tag follows the version's role, never the calendar: a
          # suffixed version is a pre-release and must not take `latest`.
          case "$VERSION" in
            *-*) DIST_TAG="beta" ;;
            *)   DIST_TAG="latest" ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist-tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      # A version the registry has ever held — published, or published and
      # unpublished — is permanently unusable. `time` lists those tombstones;
      # `versions` omits them, so checking only the latter is how a
      # rename-then-unpublish sequence walks into a version that can never be
      # published. A live version, by contrast, is a re-run: skip it.
      - name: Refuse a version the registry has ever seen; skip a live one
        id: gate
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').name")
          VERSION="${{ steps.meta.outputs.version }}"
          if npm view "$PKG" time --json | grep -q "\"$VERSION\""; then
            if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
              echo "::notice::$PKG@$VERSION is already published; skipping (tag kept for provenance)"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::$PKG@$VERSION was published before and unpublished — a seen version can never return; pick a new version"
              exit 1
            fi
          else
            echo "$PKG@$VERSION is unused on the registry"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci

      # npm >= 11.5.1 does the id-token exchange; node 22 bundles npm 10,
      # which has no trusted publishing at all and would fail silently.
      - name: Give npm the OIDC-capable CLI
        run: npm install -g npm@latest && npm --version

      - name: Publish (trusted publishing; silly so a failed exchange is visible)
        if: steps.gate.outputs.skip != 'true'
        run: npm publish --provenance --tag "${{ steps.meta.outputs.dist-tag }}" --loglevel silly
        env:
          NODE_AUTH_TOKEN: ""

      - name: Record what is now the default install
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').name")
          VERSION="${{ steps.meta.outputs.version }}"
          DIST_TAG="${{ steps.meta.outputs.dist-tag }}"
          if [ "${{ steps.gate.outputs.skip }}" = "true" ]; then
            echo "$PKG@$VERSION was already live — dist-tags now:"
          else
            echo "published $PKG@$VERSION under $DIST_TAG"
          fi
          npm view "$PKG" dist-tags --json
          npm view "$PKG" versions --json

  # The host half of the engine, its own package and its own tag line:
  # doppler-opencode-<semver>. Release order matters — its dependency on the
  # core is a real npm range, so the core publishes first and this job's
  # `npm install` resolves it.
  publish-opencode:
    if: startsWith(inputs.tag || github.event.release.tag_name, 'doppler-opencode-')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/opencode/doppler
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Name this job what it is publishing
        id: meta
        run: |
          set -euo pipefail
          # GITHUB_REF_NAME is the ref the dispatch ran from (main), not the
          # input — the same expression the core job and the checkout use.
          REF="${{ inputs.tag || github.event.release.tag_name }}"
          TAG="${REF#doppler-opencode-}"
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::${REF} is not doppler-opencode-<semver>"
            exit 1
          fi
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag $TAG does not match package.json $VERSION — the tag is the contract; bump them together"
            exit 1
          fi
          case "$VERSION" in
            *-*) DIST_TAG="beta" ;;
            *)   DIST_TAG="latest" ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist-tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      - name: Refuse a version the registry has ever seen; skip a live one
        id: gate
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').name")
          VERSION="${{ steps.meta.outputs.version }}"
          if npm view "$PKG" time --json | grep -q "\"$VERSION\""; then
            if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
              echo "::notice::$PKG@$VERSION is already published; skipping (tag kept for provenance)"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::$PKG@$VERSION was published before and unpublished — a seen version can never return; pick a new version"
              exit 1
            fi
          else
            echo "$PKG@$VERSION is unused on the registry"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # One node_modules tree only: the build spans adapter files and core
      # src, so installing both roots yields two @opencode-ai/sdk copies whose
      # OpencodeClient types do not unify (TS2345 on every call site). The
      # root npm ci already covers the adapter's declared devDependencies —
      # the same three packages — and npm run resolves tsc from ancestor
      # node_modules/.bin (the adapter has no node_modules of its own in any
      # working checkout).
      - run: npm ci
        working-directory: .
      - run: npm run build

      # npm >= 11.5.1 does the id-token exchange; node 22 bundles npm 10,
      # which has no trusted publishing at all and would fail silently.
      - name: Give npm the OIDC-capable CLI
        run: npm install -g npm@latest && npm --version

      - name: Publish (trusted publishing; silly so a failed exchange is visible)
        if: steps.gate.outputs.skip != 'true'
        run: npm publish --provenance --tag "${{ steps.meta.outputs.dist-tag }}" --loglevel silly
        env:
          NODE_AUTH_TOKEN: ""

      # Every adapter release so far is a beta, and the README's versionless
      # install must resolve the current one — so latest rides along with each
      # beta, exactly as winch-opencode's workflow does. A stable release takes
      # latest natively through the publish tag.
      - name: Point latest at this beta
        if: steps.meta.outputs.dist-tag == 'beta'
        run: |
          set -euo pipefail
          npm dist-tag add "@igorjpimenta/doppler-opencode@${{ steps.meta.outputs.version }}" latest
        env:
          NODE_AUTH_TOKEN: ""
